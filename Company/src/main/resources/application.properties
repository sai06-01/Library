spring.application.name=Company

spring.profiles.active=dev

# Server - main port

server.port=8080

# Common Database Configuration

spring.datasource.url=jdbc:mysql://localhost:3306/Company?useSSL=false&serverTimezone=Asia/Kolkata

spring.datasource.username=root

spring.datasource.password=Saigeetha12@34

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration

spring.jpa.generate-ddl=true

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false

# Logging

logging.level.root=INFO

logging.level.com.example.demo=DEBUG

logging.level.Companylogger=DEBUG

logging.file.name=logs/company.log

# Swagger

springdoc.api-docs.path=/v3/api-docs

springdoc.swagger-ui.path=/swagger-ui.html

# Actuator

management.endpoints.web.exposure.include=*

management.endpoint.health.show-details=always

# Hikari Connection Pool

spring.datasource.hikari.pool-name=CompanyHikariPool

spring.datasource.hikari.maximum-pool-size=10

spring.datasource.hikari.minimum-idle=2

spring.datasource.hikari.connection-timeout=30000

spring.datasource.hikari.idle-timeout=600000

spring.datasource.hikari.max-lifetime=1800000

# File Upload

spring.servlet.multipart.max-file-size=10MB

spring.servlet.multipart.max-request-size=10MB